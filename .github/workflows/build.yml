name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Prepare dist directory
        shell: bash
        run: |
          mkdir -p dist/roms dist/tools
          # adb/fastboot 需自行放入 tools/，或从 platform-tools 下载
          echo "请将 adb.exe / fastboot.exe 放入 dist/tools/（见仓库 README）" > dist/tools/README.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller flash_gui.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whyred-batch-flasher
          path: dist/批量刷机工具.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/批量刷机工具.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
